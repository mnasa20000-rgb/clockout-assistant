<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>칼퇴비서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@600&display=swap">
<style>
/* 암호 입력 화면 — 사이트와 같은 색·글꼴. 칸 하나, 버튼 하나. */
:root {
  --bg: #F5F6F7; --panel: #FCFCFD; --fg: #242B32; --muted: #59636E; --line: #E0E4E8;
  --accent: #356F73; --accent-strong: #285A5E; --accent-line: #5F9093; --on-accent: #FCFCFD; --ask: #9A4D43;
  --font-head: 'Space Grotesk', 'IBM Plex Sans KR', sans-serif;
  --font-body: 'IBM Plex Sans', 'IBM Plex Sans KR', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111417; --panel: #191D21; --fg: #E3E7EB; --muted: #ADB7C1; --line: #2C3339;
    --accent: #86B7B8; --accent-strong: #A3CACB; --accent-line: #5A8B8D; --on-accent: #111417; --ask: #E2A49A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111417; --panel: #191D21; --fg: #E3E7EB; --muted: #ADB7C1; --line: #2C3339;
  --accent: #86B7B8; --accent-strong: #A3CACB; --accent-line: #5A8B8D; --on-accent: #111417; --ask: #E2A49A; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg);
  font: 15px/1.6 var(--font-body); -webkit-font-smoothing: antialiased; }
.gate { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 32px 24px; display: grid; gap: 16px; }
h1 { font: 600 24px/1.3 var(--font-head); margin: 0; }
p { margin: 0; color: var(--muted); font-size: 14px; }
form { display: grid; gap: 12px; }
label { font-size: 13px; font-weight: 500; }
input[type=password] { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--accent-line); border-radius: 4px; padding: 8px 12px; width: 100%; }
input[type=password]:focus-visible, button:focus-visible, .check input:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 400; color: var(--muted); }
button { font: 600 14px var(--font-body); color: var(--on-accent); background: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 8px 16px; cursor: pointer; transition: background 180ms ease-out; }
button:hover { background: var(--accent-strong); }
button:disabled { opacity: 0.6; cursor: wait; }
#msg { color: var(--ask); min-height: 24px; }
@media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
<script>try { var t = localStorage.getItem("kaltoe-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<main class="gate">
  <div>
    <h1>칼퇴비서</h1>
    <p>세무사무소 직원용 · 암호를 아는 분만 쓸 수 있습니다.</p>
  </div>
  <form id="f">
    <label for="pw">암호</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <label class="check"><input type="checkbox" id="remember"> 이 브라우저에서 기억하기</label>
    <button type="submit" id="go">열기</button>
    <p id="msg" role="alert"></p>
  </form>
</main>

  var KEY = "kaltoe-key";
  var bytes = function (s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  var text = function (u) { var s = ""; for (var i = 0; i < u.length; i += 8192) s += String.fromCharCode.apply(null, u.subarray(i, i + 8192)); return btoa(s); };
  var $ = function (id) { return document.getElementById(id); };

  async function rawKey(pw) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw.normalize("NFC").trim()), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: bytes(LOCK.salt), iterations: LOCK.iter }, base, 256));
  }
  // 암호가 틀리면 decrypt가 실패한다(GCM 검증). 맞으면 이 화면을 풀린 사이트로 바꾼다.
  async function open(raw, remember) {
    var k = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(LOCK.iv) }, k, bytes(LOCK.data));
    if (remember) try { localStorage.setItem(KEY, JSON.stringify({ salt: LOCK.salt, key: text(raw) })); } catch (e) {}
    var html = new TextDecoder().decode(plain);
    // 이 화면을 다 읽기 전에 바꿔 쓰면 두 문서가 섞인다
    if (document.readyState !== "complete") await new Promise(function (r) { window.addEventListener("load", r, { once: true }); });
    document.open(); document.write(html); document.close();
  }
  // 기억해 둔 열쇠는 같은 암호문(salt)일 때만 쓴다. 사이트를 다시 잠그면 다시 묻는다.
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (saved && saved.salt === LOCK.salt) { open(bytes(saved.key), false).catch(function () { try { localStorage.removeItem(KEY); } catch (e) {} }); }
  } catch (e) {}
  $("f").addEventListener("submit", async function (e) {
    e.preventDefault();
    $("go").disabled = true; $("msg").textContent = "여는 중…";
    await new Promise(function (r) { setTimeout(r, 0); }); // '여는 중'을 먼저 그린다
    var go = $("go"), msg = $("msg"), pw = $("pw"), remember = $("remember").checked;
    try {
      await open(await rawKey(pw.value), remember);
    } catch (err) {
      go.disabled = false; msg.textContent = "암호가 맞지 않습니다."; pw.select();
    }
  });
})();
